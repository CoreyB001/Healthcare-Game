<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#204883">
  <meta name="description" content="Health Quest by Beebe Healthcare: a five-lane scrolling game featuring 288 healthy and unhealthy behaviors.">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Health Quest by Beebe Healthcare</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16334b;background:#e8f2f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;justify-content:center}
    main{width:min(100%,480px);background:#fff;min-height:100dvh;display:flex;flex-direction:column}
    .top{padding:11px 12px 8px}
    .brand-header{display:flex;align-items:center;gap:12px;margin-bottom:9px}
    .brand-logo{width:137px;max-width:43%;height:auto;display:block;flex:0 0 auto}
    .brand-title{font-size:22px;font-weight:900;line-height:1.05;margin:0;color:#204883}
    .brand-subtitle{font-size:12px;font-weight:800;color:#546c7b;margin-top:4px}
    .stats{display:flex;justify-content:space-between;gap:4px;font-size:13px;font-weight:750;align-items:center}
    .stats span{white-space:nowrap}
    .stats #level{overflow:hidden;text-overflow:ellipsis}
    .progress{height:6px;background:#d9e5e8;border-radius:9px;margin-top:9px;overflow:hidden}
    .progress div{height:100%;width:0;background:#2a9d77}
    .game{position:relative;flex:1;min-height:395px;max-height:740px;overflow:hidden;touch-action:none;user-select:none;background:linear-gradient(#8fd9ff 0%,#dff7ff 43%,#9ed577 44%,#4d9c52 100%);transition:background .5s}
    .game::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),#ffffff70 calc(20% - 1px),#ffffff70 20%)}
    .horizon{position:absolute;top:12%;left:0;right:0;text-align:center;font-size:64px;opacity:.38;pointer-events:none}
    .choice{position:absolute;transform:translate(-50%,-50%);width:calc(20% - 5px);max-width:90px;min-height:76px;padding:6px 2px 5px;border-radius:10px;background:#ffffffed;box-shadow:0 3px 7px #0003;text-align:center;line-height:1.12;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
    .choice .emoji{display:block;font-size:25px;line-height:1}
    .choice .desc{display:block;width:100%;padding:0 1px;font-size:clamp(8px,2.55vw,10px);font-weight:800;overflow-wrap:anywhere;line-height:1.1;text-wrap:balance}
    .point-pop{position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:22px;font-weight:900;text-shadow:0 2px 3px #fff,0 0 8px #fff;pointer-events:none;animation:point-float .9s ease-out forwards}
    @keyframes point-float{to{transform:translate(-50%,-115%);opacity:0}}
    .good{color:#087a43}.bad{color:#b62736}
    .player{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:40px;filter:drop-shadow(0 3px 3px #0005);transition:left .09s;pointer-events:none;z-index:1}
    .overlay{position:absolute;inset:0;z-index:3;background:#102e45ed;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 17px;gap:10px;overflow-y:auto}
    .overlay-brand{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
    .overlay-logo{display:block;width:155px;max-width:65%;height:auto;background:#fff;border-radius:7px;padding:5px}
    .overlay-title{font-size:23px;font-weight:900;line-height:1.05;margin:4px 0 0}
    .overlay-by{font-size:12px;font-weight:700}
    .overlay h3{font-size:18px;margin:0;line-height:1.15}
    .overlay p{line-height:1.32;margin:0;font-size:12px;max-width:365px}
    .overlay button,.controls button{border:0;border-radius:12px;background:#147d65;color:white;padding:11px 14px;font-weight:800;font-size:15px;cursor:pointer;min-height:43px}
    .overlay button{background:#fff;color:#13435b;padding:10px 22px;flex-shrink:0}
    .mode-picker{border:0;margin:0;padding:0;width:100%;max-width:350px;flex-shrink:0}
    .mode-picker legend{padding:0;margin:0 auto 7px;font-size:12px;font-weight:850}
    .mode-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .mode-options label{display:flex;align-items:center;justify-content:center;position:relative;min-height:42px;border:2px solid #a1b5c4;border-radius:10px;background:#ffffff17;font-size:13px;font-weight:800;cursor:pointer}
    .mode-options input{position:absolute;opacity:0;width:1px;height:1px}
    .mode-options label:has(input:checked){background:#fff;color:#194777;border-color:#ffcf55}
    .mode-options label:has(input:focus-visible){outline:3px solid #ffcf55;outline-offset:2px}
    .mode-detail{min-height:15px;font-size:11px!important;color:#e5f7ff}
    .controls{display:flex;gap:8px;justify-content:center;padding:9px 10px}
    .controls button{flex:1;max-width:145px;touch-action:manipulation}
    .controls button:focus-visible,.overlay button:focus-visible{outline:3px solid #ffc83d;outline-offset:2px}
    .controls button:disabled{opacity:.45}
    .tip{min-height:37px;padding:3px 12px 7px;text-align:center;font-size:12px;color:#426275;line-height:1.25}
    .footer{font-size:10px;color:#59727c;text-align:center;padding:0 10px 9px}
    .hidden{display:none!important}
    @media(max-width:370px){.brand-logo{width:110px}.brand-title{font-size:20px}.brand-subtitle{font-size:11px}.choice{width:calc(20% - 4px);min-height:73px}.choice .emoji{font-size:22px}.choice .desc{font-size:9px}.player{font-size:36px}.horizon{font-size:54px}}
    @media(max-height:680px){.top{padding-top:6px}.game{min-height:345px}.overlay{gap:7px;padding:9px 12px}.overlay-logo{width:125px}.overlay-title{font-size:20px}.overlay p{font-size:11px}.overlay h3{font-size:16px}.mode-options label{min-height:36px}.controls{padding:7px 10px}.controls button{min-height:38px;padding:7px}}
    @media(prefers-reduced-motion:reduce){.player,.game{transition:none!important}.point-pop{animation-duration:.01s}}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="brand-header">
        <img class="brand-logo" src="./beebe-logo.png" alt="Beebe Healthcare logo">
        <div>
          <h1 class="brand-title">Health Quest</h1>
          <div class="brand-subtitle">by Beebe Healthcare</div>
        </div>
      </div>
      <div class="stats"><span id="score" aria-live="off">Score: 100</span><span id="level">Normal · L1 Fields</span><span id="clock">0:00</span></div>
      <div class="progress" aria-hidden="true"><div id="progress"></div></div>
    </div>
    <div class="game" id="game" aria-label="Five-lane health choices game. Tap or drag to a lane, use left and right buttons, or use keyboard arrows.">
      <div class="horizon" id="horizon">🌳 🌻 🌳</div>
      <div class="player" id="player" aria-hidden="true">🏃</div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Health Quest menu"></div>
    </div>
    <div class="controls">
      <button id="left" aria-label="Move one lane left">◀ Left</button>
      <button id="pause" aria-label="Pause or resume game">Pause</button>
      <button id="right" aria-label="Move one lane right">Right ▶</button>
    </div>
    <div class="tip" id="tip" aria-live="polite">288 health choices · Points appear after collecting an icon.</div>
    <div class="footer">Educational game only · Scores are illustrative, not medical measurements.</div>
  </main>
  <script src="./behaviors.js"></script>
  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id);
    const game=$('game'), overlay=$('overlay'), player=$('player'), tip=$('tip');
    const LANES=5;
    const levels=[
      {name:'Fields',emoji:'🌳 🌻 🌳',bg:'linear-gradient(#8fd9ff 0%,#e1f6ff 43%,#9ed577 44%,#4d9c52 100%)'},
      {name:'Desert',emoji:'🌵 ☀️ 🌵',bg:'linear-gradient(#7ccaf1 0%,#ffe4a3 43%,#edc17a 44%,#b77842 100%)'},
      {name:'Ocean',emoji:'🐬 🏝️ 🐚',bg:'linear-gradient(#a3e4fa 0%,#e4fbff 38%,#52c8d1 39%,#087d9b 100%)'},
      {name:'Mountains',emoji:'🏔️ ⛰️ 🏔️',bg:'linear-gradient(#8cc6f4 0%,#eaf8ff 38%,#a7b5c7 39%,#4f718b 100%)'},
      {name:'Forest',emoji:'🌲 🌲 🌲',bg:'linear-gradient(#9dd6c6 0%,#6fae83 35%,#215a43 100%)'},
      {name:'Arctic',emoji:'❄️ 🧊 ❄️',bg:'linear-gradient(#b0e2f6 0%,#f8fdff 50%,#b2d9e8 100%)'},
      {name:'Space',emoji:'🪐 ⭐ 🌙',bg:'linear-gradient(#10132c 0%,#35346b 60%,#151a3a 100%)'}
    ];
    // All 288 behaviors and the exact signed point values from the supplied CSVs.
    // The fourth field is the source category, used in the collection feedback.
    const choices=window.HEALTH_QUEST_CHOICES;
    if(!Array.isArray(choices)||choices.length!==288){
      throw new Error('Health Quest behavior data is missing or incomplete.');
    }
    let choiceDeck=[];
    function nextChoice(){
      // A shuffled deck avoids repeats until every supplied behavior has appeared.
      if(choiceDeck.length===0){
        choiceDeck=choices.slice();
        for(let i=choiceDeck.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [choiceDeck[i],choiceDeck[j]]=[choiceDeck[j],choiceDeck[i]];
        }
      }
      return choiceDeck.pop();
    }
    // Normal baseline. Both fall speed and number of icons increase across levels.
    const progression=[
      {speed:150,waveEvery:1.80,perWave:1},
      {speed:185,waveEvery:1.55,perWave:2},
      {speed:220,waveEvery:1.35,perWave:2},
      {speed:265,waveEvery:1.18,perWave:3},
      {speed:310,waveEvery:1.00,perWave:3},
      {speed:360,waveEvery:0.90,perWave:4},
      {speed:420,waveEvery:0.78,perWave:5}
    ];
    // Easy slows and spaces waves; Challenging speeds up and adds more icons.
    const modes={
      easy:{label:'Easy',speedFactor:.75,waveFactor:1.3,waveDelta:-1,description:'Slower icons · fewer choices'},
      normal:{label:'Normal',speedFactor:1,waveFactor:1,waveDelta:0,description:'Balanced speed · standard choices'},
      challenging:{label:'Challenging',speedFactor:1.3,waveFactor:.8,waveDelta:1,description:'Faster icons · more choices'}
    };
    const duration=18,total=duration*levels.length;
    let lane=2,score=100,elapsed=0,level=0,objects=[],running=false,paused=false,last=0,spawn=0,frame=0,previousLevel=-1,mode='normal';
    function settings(l=level){
      const base=progression[l],m=modes[mode];
      return {speed:base.speed*m.speedFactor,waveEvery:base.waveEvery*m.waveFactor,perWave:Math.max(1,Math.min(LANES,base.perWave+m.waveDelta))};
    }
    function move(n){lane=Math.max(0,Math.min(LANES-1,n));player.style.left=((lane+.5)/LANES*100)+'%'}
    function update(){
      $('score').textContent='Score: '+score;
      $('level').textContent=modes[mode].label+' · L'+(level+1)+' '+levels[level].name;
      $('clock').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
      $('progress').style.width=Math.min(100,elapsed/total*100)+'%';
    }
    function clear(){
      cancelAnimationFrame(frame);
      objects.forEach(o=>o.el.remove());objects=[];
      game.querySelectorAll('.point-pop').forEach(el=>el.remove());
    }
    function node(tag,className,content){const el=document.createElement(tag);if(className)el.className=className;if(content!==undefined)el.textContent=content;return el}
    function show(title,message,label,action,chooseMode=false){
      overlay.classList.remove('hidden');overlay.replaceChildren();
      const brand=node('div','overlay-brand'),logo=node('img','overlay-logo'),name=node('h2','overlay-title','Health Quest'),by=node('div','overlay-by','by Beebe Healthcare');
      logo.src='./beebe-logo.png';logo.alt='Beebe Healthcare logo';brand.append(logo,name,by);
      overlay.append(brand);
      if(title)overlay.append(node('h3','',title));
      overlay.append(node('p','',message));
      if(chooseMode){
        const pick=node('fieldset','mode-picker'),legend=node('legend','','Choose difficulty'),options=node('div','mode-options'),detail=node('p','mode-detail',modes[mode].description);
        pick.append(legend,options);
        for(const key of ['easy','normal','challenging']){
          const lbl=node('label'),radio=node('input'),caption=node('span','',modes[key].label);
          radio.type='radio';radio.name='difficulty';radio.value=key;radio.checked=(key===mode);
          radio.addEventListener('change',()=>{if(radio.checked){mode=key;detail.textContent=modes[mode].description;update()}});
          lbl.append(radio,caption);options.append(lbl);
        }
        overlay.append(pick,detail);
      }
      const button=node('button','',label);button.addEventListener('click',action);overlay.append(button);
    }
    function showStart(title='Ready to play?'){
      show(title,'Explore 288 healthy and unhealthy choices across five lanes. Start with 100 points; scores appear only after collection. The game ends below 0 points.', 'Start game',start,true);
    }
    function start(){
      clear();choiceDeck=[];score=100;elapsed=0;level=0;previousLevel=-1;spawn=0;paused=false;running=true;move(2);
      overlay.classList.add('hidden');$('pause').textContent='Pause';tip.textContent=modes[mode].label+' mode · Collect choices to discover their values!';
      last=performance.now();update();frame=requestAnimationFrame(tick);
    }
    function pause(){
      if(!running)return;
      paused=!paused;$('pause').textContent=paused?'Resume':'Pause';
      if(paused){cancelAnimationFrame(frame);show('Paused','Your '+modes[mode].label.toLowerCase()+' journey is waiting.','Resume',pause)}
      else{overlay.classList.add('hidden');last=performance.now();frame=requestAnimationFrame(tick)}
    }
    function addIcon(l){
      const c=nextChoice(),el=node('div','choice'),emoji=node('span','emoji',c[0]),desc=node('span','desc',c[1]);
      el.title=c[1];
      el.style.left=((l+.5)/LANES*100)+'%';el.append(emoji,desc);game.append(el);objects.push({el,l,y:-70,c,done:false});
    }
    function addWave(s){
      const lanes=Array.from({length:LANES},(_,i)=>i);
      for(let i=lanes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lanes[i],lanes[j]]=[lanes[j],lanes[i]]}
      for(let i=0;i<s.perWave;i++)addIcon(lanes[i]);
    }
    function showPoints(o){
      const pop=node('div','point-pop '+(o.c[2]>=0?'good':'bad'),(o.c[2]>0?'+':'')+o.c[2]);
      pop.style.left=((o.l+.5)/LANES*100)+'%';pop.style.top=(o.y-34)+'px';
      game.append(pop);pop.addEventListener('animationend',()=>pop.remove(),{once:true});setTimeout(()=>pop.remove(),1200);
    }
    function tick(now){
      if(!running||paused)return;
      const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;
      level=Math.min(levels.length-1,Math.floor(elapsed/duration));
      const s=settings();
      if(level!==previousLevel){
        previousLevel=level;game.style.background=levels[level].bg;$('horizon').textContent=levels[level].emoji;
        tip.textContent='Level '+(level+1)+': '+levels[level].name+' · '+s.perWave+' icon'+(s.perWave===1?'':'s')+' per wave';
      }
      spawn+=dt;
      // Adjust number of spawned waves as difficulty increases.
      while(spawn>=s.waveEvery){spawn-=s.waveEvery;addWave(s)}
      const h=game.clientHeight;
      for(let i=objects.length-1;i>=0;i--){
        const o=objects[i];o.y+=dt*s.speed;o.el.style.top=o.y+'px';
        if(!o.done&&o.y>=h-65){
          o.done=true;
          if(o.l===lane){
            score+=o.c[2];showPoints(o);
            tip.textContent=o.c[0]+' '+o.c[1]+' · '+(o.c[2]>0?'+':'')+o.c[2]+' points · '+o.c[3];o.el.style.opacity='.3';
            if(score<0){
              update();running=false;clear();
              show('Game over','Your score dropped below zero ('+score+'). You reached Level '+(level+1)+' on '+modes[mode].label+' difficulty.','Try again',start,true);
              return;
            }
          }
        }
        if(o.y>h+75){o.el.remove();objects.splice(i,1)}
      }
      update();
      if(elapsed>=total){
        running=false;clear();
        show('Journey complete!','Final score: '+score+' points on '+modes[mode].label+' difficulty. You explored all seven landscapes!','Play again',start,true);
        return;
      }
      frame=requestAnimationFrame(tick);
    }
    $('left').addEventListener('click',()=>{if(running&&!paused)move(lane-1)});
    $('right').addEventListener('click',()=>{if(running&&!paused)move(lane+1)});
    $('pause').addEventListener('click',pause);
    function steer(x){const r=game.getBoundingClientRect();move(Math.floor((x-r.left)/r.width*LANES))}
    game.addEventListener('pointerdown',e=>{if(running&&!paused){game.setPointerCapture?.(e.pointerId);steer(e.clientX)}});
    game.addEventListener('pointermove',e=>{if(running&&!paused&&(e.buttons||e.pointerType==='touch'&&game.hasPointerCapture?.(e.pointerId)))steer(e.clientX)});
    document.addEventListener('keydown',e=>{
      if(!running||paused)return;
      if(e.key==='ArrowLeft'){e.preventDefault();move(lane-1)}
      if(e.key==='ArrowRight'){e.preventDefault();move(lane+1)}
      if(e.key===' '){e.preventDefault();pause()}
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
    move(2);update();showStart();
    if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
  </script>
</body>
</html>
